[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "heatwatch-data-ingestion"
version = "0.1.0"
description = "ETL / data ingestion module for HEATWATCH — Satellite Thermal Intelligence"
requires-python = ">=3.10"
dependencies = [
    # Database
    "psycopg[binary]>=3.1",          # PostgreSQL driver (psycopg v3)
    "psycopg-pool>=3.1",              # Connection pooling

    # Data manipulation
    "pandas>=2.0",
    "numpy>=1.24",

    # Geospatial
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "fiona>=1.9",                     # GeoJSON/GeoPackage/Shapefile reading

    # Raster (land-cover)
    "rasterio>=1.3",

    # Configuration / environment
    "python-dotenv>=1.0",

    # HTTP (optional FIRMS API metadata)
    "requests>=2.31",

    # Structured logging
    "structlog>=23.0",

    # CLI argument parsing
    "click>=8.1",

    # Data validation
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "unit: Pure unit tests (no database required)",
    "integration: Tests that require a running PostgreSQL database",
]
